<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird - Juego local</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Flappy Bird (Local)</h1>
      <p class="instructions">
        Pulsa <strong>Espacio</strong> o haz clic para volar. Evita las tuberías.
      </p>
      <canvas id="gameCanvas" width="420" height="620" aria-label="Juego estilo Flappy Bird"></canvas>
      <div class="hud">
        <p>Puntuación: <span id="score">0</span></p>
        <p>Mejor puntuación: <span id="bestScore">0</span></p>
      </div>
      <button id="restartBtn" type="button">Reiniciar partida</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
